# mypy configuration for the harness project.
#
# Run the type checker (this file is read automatically):
#     mypy            # checks the modules listed in "files" below
#     mypy src/       # check everything under src/
#
[mypy]
# Strict mode catches untyped defs/params, missing returns, implicit Any, etc.
strict = True

# Safe extra warnings.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

# Show the error code (e.g. [arg-type]) so issues are easy to look up.
show_error_codes = True

# Modules to check when mypy is invoked with no arguments.
files = src/harness.py, src/tunnel.py, src/tools.py

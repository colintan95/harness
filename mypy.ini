# mypy configuration for the harness project.
#
# Run the type checker (this file is read automatically):
#     mypy            # checks the modules listed in "files" below
#     mypy harness/ tools/   # check the source packages
#
[mypy]
# Strict mode catches untyped defs/params, missing returns, implicit Any, etc.
strict = True

# Safe extra warnings.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

# Show the error code (e.g. [arg-type]) so issues are easy to look up.
show_error_codes = True

# Directories to check when mypy is invoked with no arguments.  Naming the
# package directories (rather than a per-file list) checks the whole source
# tree, so it stays correct as modules are added or renamed -- equivalent to
# `mypy harness/ tools/`.
files = harness, tools

# duckduckgo-search (imported as ``ddgs``) is a VM-only runtime dependency of
# tools.py with no type stubs and not installed in this dev environment; tell
# mypy to treat the missing/untyped module as opaque ``Any`` instead of
# erroring on the import.
[mypy-ddgs.*]
ignore_missing_imports = True

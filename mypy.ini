# mypy configuration for the harness project.
#
# Run the type checker (this file is read automatically):
#     mypy            # checks the module listed in "files" below
#     mypy harness.py # explicit
#
[mypy]
# Strict mode catches untyped defs/params, missing returns, implicit Any, etc.
strict = True

# Safe extra warnings.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

# Show the error code (e.g. [arg-type]) so issues are easy to look up.
show_error_codes = True

# Module to check when mypy is invoked with no arguments.
files = harness.py
